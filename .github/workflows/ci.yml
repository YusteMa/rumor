name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Type-checks the panel and builds dist/, which `tauri::generate_context!` embeds.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by SHA, so the toolchain has to be named here.
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Dev-only code sits behind cfg(debug_assertions): the installer is a
      # release build, so check that one compiles too.
      - name: cargo clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
