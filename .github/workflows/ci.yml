name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Type-checks the panel and builds dist/, which `tauri::generate_context!` embeds.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by SHA, so the toolchain has to be named here.
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Dev-only code sits behind cfg(debug_assertions): the installer is a
      # release build, so check that one compiles too.
      - name: cargo clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
