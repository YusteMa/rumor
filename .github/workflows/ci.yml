name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Type-checks the panel and builds dist/, which `tauri::generate_context!` embeds.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Dev-only code sits behind cfg(debug_assertions): the installer is a
      # release build, so check that one compiles too.
      - name: cargo clippy (release)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
