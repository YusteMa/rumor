[package]
name = "rumor"
version = "0.1.0"
description = "Real-time pink, brown and white noise for the Windows tray"
authors = ["Rumor contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "rumor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cpal = "0.18.2"
thiserror = "2.0.21"
log = "0.4.34"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.0"
tauri-plugin-log = "2.10.1"
window-vibrancy = "0.8.1"
rtrb = "0.4.1"
rustfft = "6.4.1"

# The spectral tests run minutes of noise through FFTs; keep them fast in debug.
[profile.dev.package.rustfft]
opt-level = 3

# Size guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# Same major as cpal and tao use, so it is compiled once.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
# Same version Tauri uses, to reach WebView2's memory-usage API.
webview2-com = "0.39.1"
